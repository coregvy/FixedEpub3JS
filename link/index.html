<!DOCTYPE html>
<html lang="ja">

<head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3498db" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker 登録成功:', reg.scope))
            .catch(err => console.log('Service Worker 登録失敗:', err));
        });
    }
    </script>
</head>

<body>

    <header>
        <h1>My Links</h1>
        <div class="header-controls">
            <a href="https://fontawesome.com/search?o=r&m=free" target="_blank" title="Font Awesome アイコン"><i
                    class="fa-brands fa-font-awesome"></i></a>
            <a href="https://remixicon.com/" target="_blank" title="Remix Icon アイコン"><i
                    class="ri-remixicon-fill"></i></a>

            <button id="add-category-button" title="カテゴリを追加"><i class="fa-solid fa-folder-plus"></i></button>
            <button id="export-button" title="リンクをエクスポート"><i class="fa-solid fa-download"></i></button>
            <label for="import-input" class="import-label" title="リンクをインポート">
                <input type="file" id="import-input" accept=".json" style="display: none;">
                <i class="fa-solid fa-upload"></i>
            </label>
        </div>
    </header>

    <main id="link-container">
    </main>

    <div id="delete-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <p id="delete-message"></p>
            <div class="dialog-buttons">
                <button id="confirm-delete">はい</button>
                <button id="cancel-delete">いいえ</button>
            </div>
        </div>
    </div>

    <div id="add-link-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <h3>リンクを追加</h3>
            <form id="add-link-form">
                <label for="link-category-name">カテゴリ名:</label>
                <input type="text" id="link-category-name" readonly>
                <label for="link-name">リンク名:</label>
                <input type="text" id="link-name" required>
                <label for="link-url">URL:</label>
                <input type="url" id="link-url" required>
                <label for="link-icon">アイコンクラス:</label>
                <input type="text" id="link-icon" placeholder="例: fa-solid fa-user または ri-user-line" required>
                <div class="dialog-buttons">
                    <button type="submit">追加</button>
                    <button type="button" id="cancel-add-link">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <div id="add-category-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <h3>カテゴリを追加</h3>
            <form id="add-category-form">
                <label for="new-category-name">カテゴリ名:</label>
                <input type="text" id="new-category-name" required>
                <div class="dialog-buttons">
                    <button type="submit">追加</button>
                    <button type="button" id="cancel-add-category">キャンセル</button>
                </div>
            </form>
        </div>
    </div>
    <div id="script-dialog" class="dialog-overlay" style="display: none;">
        <div class="dialog-content">
            <h3>スクリプト設定</h3>
            <form id="script-form">
                <input type="hidden" id="script-category-name">
                <input type="hidden" id="script-link-name">

                <label for="script-number">実行番号 (1-8):</label>
                <select id="script-number">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>

                <label for="script-text">スクリプト内容:</label>
                <textarea id="script-text" rows="5" placeholder="ここにスクリプトを入力してください..."></textarea>

                <div class="dialog-buttons">
                    <button type="submit" style="background-color: #3498db;">保存</button>
                    <button type="button" id="cancel-script">キャンセル</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
