<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="favicon.ico" type="image/vnd.microsoft.icon" />
  <link rel="icon" href="favicon.ico" type="image/vnd.microsoft.icon" />
  <title>FixedLayout Epub3.js</title>
  <!-- BootstrapのCSS読み込み -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
    integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
  <script>
    window.dataLayer = window.dataLayer || [];
  </script>
  <!-- jQuery読み込み -->
  <script defer src="https://code.jquery.com/jquery-1.12.4.min.js"
    integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" crossorigin="anonymous"></script>
  <!-- BootstrapのJS読み込み -->
  <script defer src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
    integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
    crossorigin="anonymous"></script>
  <!-- 追加した部分 -->
  <script defer type="text/javascript" src="js/jszip.min.js"></script>
  <script defer type="text/javascript" src="js/FileSaver.js"></script>
  <script defer type="text/javascript" src="js/uuid.js"></script>
  <script defer type="text/javascript" src="js/FixedEpub3.js"></script>
  <script defer type="text/javascript" src="js/vkbeautify.js"></script>
  <script defer type="text/javascript" src="https://cdn.jsdelivr.net/npm/natsort@latest/index.min.js"></script>
</head>

<body>
  <!-- ナビゲーション -->
  <nav class="navbar navbar-default">
    <div class="container-fluid ">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbarEexample">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="https://kyukyunyorituryo.github.io/">Topページ</a>
      </div>

      <div class="collapse navbar-collapse" id="navbarEexample">
        <ul class="nav navbar-nav">
          <li><a href="./about.html">使い方</a></li>
          <li><a href="https://github.com/coregvy/FixedEpub3JS">GitHub</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class=" col-sm-2"></div>
  <div id="bg" class="container bg-info col-sm-7">

    <h2>漫画のEPUB３作成ツール</h2>
    <!-- snsボタン -->
    <h3>本の形式</h3>
    <div class="form-group ">
      <p class="control-label"><b>本の綴じ方向</b></p>
      <label class="label label-primary">ページ方向</label>
      <label class="checkbox-inline"><input type="radio" name="radio" id="binding-rtl" value="radio1"
          checked="">右から左</label>
      <label class="checkbox-inline"><input type="radio" name="radio" id="binding-ltr" value="radio2">左から右</label>
    </div>
    <div class="form-group ">
      <p class="control-label"><b>パネルビュー</b></p>
      <label class="label label-primary">拡大したときの移動方向</label>
      <label class="checkbox-inline"><input type="radio" name="radio2" id="panel-h" value="radio3"
          checked="">漫画（通常）</label>
      <label class="checkbox-inline"><input type="radio" name="radio2" id="panel-v" value="radio4">四コマ</label>
    </div>

    <h3>本の情報の入力</h3>
    <button id="paste" class="btn btn-primary">クリップボードから取得</button>
    <div class="form-group ">
      <label class="label label-primary">表題</label>
      <input type="text" class="form-control " id="title" placeholder="タイトル名">

      <label class="label label-primary">著者１</label>
      <input type="text" class="form-control" id="author1" placeholder="著者名１">
      <label class="label label-primary">著者２(任意)</label>
      <input type="text" class="form-control" id="author2" placeholder="著者名２(任意)">
      <!-- 多言語対応-->
      <label class="label label-primary">言語選択</label>
      <select class="form-control" id="LangSelect">
        <option value="zh">中国語</option>
        <option value="en">英語</option>

        <option selected value="ja">日本語</option>
      </select>
      <!-- 多言語対応-->
      <label class="label label-primary">表紙画像</label>
      <input type="file" id="coverfile" name="coverfile" accept="image/png,image/jpeg,image/webp">
      <output id="coverthumb"></output>
      <label class="label label-primary">画像の横幅</label>
      <input type="number" class="form-control" id="imgwidth" min="1" value="800" placeholder="800">
      <label class="label label-primary">画像の高さ</label>
      <input type="number" class="form-control" id="imgheight" min="1" value="1200" placeholder="1200">
    </div>
    <style>
      .thumb {
        height: 75px;
        border: 1px solid #000;
        margin: 10px 5px 0 0;
      }
    </style>
    <div>
      <label class="label label-primary">本文ファイルの読み込み</label>
      <input type="file" id="files" name="files[]" multiple="multiple" accept="image/png,image/jpeg,image/webp">
      <output id="list"></output>
      <label class="label label-primary">画像の整列</label>

      <div><button type=button id="sort">名前順に整列</button></div>

      <div>
        <label class="label label-primary" for="imgtype">画像の形式 (webp使用時)</label>
        <select id="imgtype" class="form-control">
          <option value="image/png">png</option>
          <option value="image/jpeg">jpg</option>
        </select>
      </div>
    </div>

    <h3>目次の編集</h3>
    <div id="menu-group">
      <label class="label label-primary">目次の選択</label>
      <form class="form-inline">
        <div class="form-group">
          <label class="sr-only" for="InputSelect">選択</label>
          <select class="form-control" id="InputSelect">
            <option>Cover</option>
          </select>
        </div>
        <div class="form-group">
          <label class="sr-only">目次の書換</label>
          <input type="text" class="form-control" id="covertext" value="表紙" placeholder="目次タイトル">
        </div>
      </form>

      <form class="form-inline" name="formNav">

        <div class="form-group">
          <label class="sr-only" for="InputSelect">選択</label>
          <select class="form-control" id="InputSelect2" name="selectNav">
            <option>本文の選択</option>
          </select>
        </div>
        <div class="form-group">
          <label class="sr-only">目次の書換</label>
          <input type="text" class="form-control" id="navtext1" name="editNav" value="目次" placeholder="目次タイトル">
        </div>
      </form>
    </div>
    <!--目次の追加や削除-->
    <button type="submit" class="btn btn-default" id="addmenu">追加</button>
    <button type="submit" class="btn btn-default" id="removeselect">削除</button>

    <h3>ファイルの出力</h3>

    <button id="demo" class="btn btn-primary">保存</button>
    <button id="clear" class="btn btn-primary">クリア</button>
    <h3>EPUBビュワー</h3>
    <label class="label label-primary">クリックしドラッグアンドドロップでEPUBを確認する</label></br>
    <a class="btn btn-info" href="Bibi/bibi/index.html" target="_blank">EPUBビュワーBiB/i（ビビ）</a>
    <span id="status"></span>
    <!-- モーダルの設定です -->
    <div class="modal fade" id="imagemodal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
      aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span
                class="sr-only">Close</span></button>
            <h4 class="modal-title" id="myModalLabel">プレビュー</h4>
          </div>

          <div class="modal-body">
            <img src="" id="imagepreview" class="img-responsive">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div><!-- /modal -->
  </div>

</body>

</html>
